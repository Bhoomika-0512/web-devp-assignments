<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Club</title>
<style>
 /* Variables: change a colour here and it changes everywhere */
 :root {
 --brand: #04103b;
 --light: #eef2ff;
 --dark: #0e1425;
 --gap: 18px;
 }
 /* * = every element */
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 font-family:Arial, Helvetica, sans-serif
 background: var(--light);
 color: var(--dark);
 line-height: 1.8;
 padding: var(--gap);
 }
 /* h1 = element selector */
 h1 { font-size: 2.7rem; letter-spacing: 1cqb; }
 /* #hero = id selector (only one on the page) */
 #hero {
 background: var(--brand);
 color: rgb(196, 182, 182);
 text-align: center;
 padding: 35px var(--gap);
 border-radius: 12px;
 }
 /* .card = class selector (use many times) */
 .card {
 background: white;
 padding: var(--gap);
 margin-top: var(--gap);
 border-radius: 12px;
 }
 table { width: 100%; border-collapse: collapse; margin-top: 9px; }
 th { background: var(--brand); color: white; text-align: left; }
 th, td { padding: 8px; border-bottom: 1px solid #ccd; }
 input { padding: 6px; margin: 4px 0; }
 button { background: var(--brand); color: white; border: 0; padding: 10px 18px; border-radius: 6px; font-size: 1rem; }
</style>
</head>
<body>
 <div id="hero">
 <h1>Coding Club</h1>
 <p>Learn. Build. Share.</p>
 </div>
 <div class="card">
 <h2>Upcoming Events</h2>
 <table>
 <tr><th>Event</th><th>Date</th><th>Venue</th></tr>
 <tr><td>HTML Workshop</td><td>18 Nov</td><td>Lab 10</td></tr>
 <tr><td>Hackathon</td><td>28 Nov</td><td>Seminar Hall-1</td></tr>
 </table>
 </div>
 <div class="card">
 <h2>Register</h2>
 <p>Name: <input type="text" placeholder="Your name"></p>
 <p>Email: <input type="email" placeholder="you@example.com"></p>
 <button>Register</button>
 </div>
</body>
</html>
